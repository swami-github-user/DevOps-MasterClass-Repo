<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome to Our Website</title>
    <style>
        /* Reset basic styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* Body styling with a clean gradient background */
        body {
            background: linear-gradient(135deg, #74b9ff, #0984e3);
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vi;
            height: 100vh;
        }

        /* Main welcome card container */
        .welcome-card {
            background: #ffffff;
            padding: 2.5rem;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            text-align: center;
            max-width: 500px;
            width: 90%;
        }

        /* Headline styling */
        .welcome-card h1 {
            color: #2d3436;
            font-size: 2.5rem;
            margin-bottom: 1rem;
        }

        /* Paragraph text description */
        .welcome-card p {
            color: #636e72;
            font-size: 1.1rem;
            line-height: 1.6;
            margin-bottom: 2rem;
        }

        /* Call-to-action button styling */
        .cta-button {
            display: inline-block;
            background-color: #0984e3;
            color: #ffffff;
            padding: 0.8rem 2rem;
            font-size: 1rem;
            font-weight: 600;
            text-decoration: none;
            border-radius: 30px;
            transition: background-color 0.3s ease, transform 0.2s ease;
        }

        /* Button hover animation effects */
        .cta-button:hover {
            background-color: #074b83;
            transform: translateY(-2px);
        }

        .cta-button:active {
            transform: translateY(0);
        }
    </style>
</head>
<body>

    <!-- Core Structure of the Welcome Section -->
    <main class="welcome-card">
        <h1>Welcome!</h1>
        <p>We are absolutely thrilled to have you here. Explore our features, discover new possibilities, and kickstart your journey with us today.</p>
        <a href="#explore" class="cta-button">Get Started</a>
    </main>

</body>
</html>
